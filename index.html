
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraftHub | Learning Dashboard</title>

    <style>
        :root {
            --purple: #8b5cf6;
            --purple-dark: #7042dc;
            --amber: #f59e0b;
            --red: #ef4444;
            --green: #16a34a;
            --background: #f7f7fb;
            --white: #ffffff;
            --text: #25233a;
            --muted: #77758b;
            --border: #ecebf2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand {
            font-size: 23px;
            font-weight: 800;
            color: var(--purple);
        }

        .brand span {
            color: var(--text);
        }

        .tagline {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 9px;
            padding: 11px 17px;
            font-weight: 600;
            transition: 0.2s;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .primary-btn {
            background: var(--purple);
            color: white;
        }

        .primary-btn:hover {
            background: var(--purple-dark);
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .welcome {
            margin-bottom: 28px;
        }

        .welcome h1 {
            font-size: 29px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(30, 20, 70, 0.03);
        }

        .stat-card p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .stat-card h2 {
            font-size: 30px;
        }

        .stat-card.total { border-left: 4px solid var(--purple); }
        .stat-card.pending { border-left: 4px solid var(--amber); }
        .stat-card.progress { border-left: 4px solid #3b82f6; }
        .stat-card.completed { border-left: 4px solid var(--green); }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .section-heading h2 {
            font-size: 21px;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
            background: white;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--purple);
        }

        .filters input {
            flex: 1;
            min-width: 200px;
        }

        .filters select {
            width: 190px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .course-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 21px;
            box-shadow: 0 3px 12px rgba(30, 20, 70, 0.03);
        }

        .course-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }

        .description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            min-height: 44px;
            margin-bottom: 17px;
        }

        .course-info {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.9;
            margin-bottom: 16px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .status.not-started {
            background: #fff4d6;
            color: #a16207;
        }

        .status.in-progress {
            background: #e9efff;
            color: #3156bb;
        }

        .status.completed {
            background: #dcfce7;
            color: #15803d;
        }

        .card-actions {
            display: flex;
            gap: 9px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .edit-btn {
            background: #f0eaff;
            color: var(--purple-dark);
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .empty-state {
            background: white;
            border: 1px dashed #d7d3e5;
            border-radius: 13px;
            padding: 55px 20px;
            text-align: center;
            color: var(--muted);
            grid-column: 1 / -1;
        }

        .empty-state h3 {
            color: var(--text);
            margin-bottom: 9px;
        }

        .message {
            padding: 13px 16px;
            border-radius: 9px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            grid-column: 1 / -1;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(25, 20, 45, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 28px;
            border-radius: 15px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 23px;
        }

        .close-btn {
            background: #f1f0f5;
            font-size: 19px;
            padding: 6px 11px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        textarea {
            min-height: 95px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        .cancel-btn {
            background: #eeeef3;
            color: var(--text);
        }

        @media (max-width: 850px) {
            .course-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            header {
                padding: 17px 5%;
                align-items: flex-start;
                flex-direction: column;
            }

            main {
                margin-top: 28px;
                padding: 0 16px;
            }

            .course-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                gap: 10px;
            }

            .stat-card {
                padding: 16px;
            }

            .section-heading {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div>
        <div class="brand">CodeCraft<span>Hub.</span></div>
        <div class="tagline">Your Personal Learning Space</div>
    </div>

    <button class="primary-btn" id="addCourseBtn">
        + Add New Course
    </button>
</header>

<main>

    <section class="welcome">
        <h1>Welcome to your dashboard 👋</h1>
        <p>Organize your learning journey and track your progress.</p>
    </section>

    <div id="message" class="message"></div>

    <section class="stats">
        <div class="stat-card total">
            <p>Total Courses</p>
            <h2 id="totalCount">0</h2>
        </div>

        <div class="stat-card pending">
            <p>Not Started</p>
            <h2 id="pendingCount">0</h2>
        </div>

        <div class="stat-card progress">
            <p>In Progress</p>
            <h2 id="progressCount">0</h2>
        </div>

        <div class="stat-card completed">
            <p>Completed</p>
            <h2 id="completedCount">0</h2>
        </div>
    </section>

    <section>
        <div class="section-heading">
            <h2>My Learning Courses</h2>
        </div>

        <div class="filters">
            <input
                type="search"
                id="searchInput"
                placeholder="Search courses..."
            >

            <select id="statusFilter">
                <option value="All">All Statuses</option>
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
        </div>

        <div id="courseGrid" class="course-grid">
            <div class="loading">Loading your courses...</div>
        </div>
    </section>

</main>

<!-- Add / Edit Modal -->

<div class="modal" id="courseModal">
    <div class="modal-content">

        <div class="modal-header">
            <h2 id="modalTitle">Add New Course</h2>
            <button class="close-btn" id="closeModalBtn">×</button>
        </div>

        <form id="courseForm">

            <div class="form-group">
                <label for="courseName">Course Name</label>
                <input
                    type="text"
                    id="courseName"
                    required
                    placeholder="e.g. Python for Beginners"
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    required
                    placeholder="What will you learn?"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="targetDate">Target Completion Date</label>
                <input type="date" id="targetDate" required>
            </div>

            <div class="form-group">
                <label for="courseStatus">Status</label>
                <select id="courseStatus" required>
                    <option value="Not Started">Not Started</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="button" class="cancel-btn" id="cancelBtn">
                    Cancel
                </button>

                <button type="submit" class="primary-btn" id="saveBtn">
                    Save Course
                </button>
            </div>

        </form>
    </div>
</div>

<script>
    // API configuration
    const API_URL = "http://127.0.0.1:5000/api/courses";

    // Application state
    let courses = [];
    let editingCourseId = null;

    // DOM elements
    const courseGrid = document.getElementById("courseGrid");
    const courseModal = document.getElementById("courseModal");
    const courseForm = document.getElementById("courseForm");
    const messageBox = document.getElementById("message");

    // Display success or error messages
    function showMessage(message, type) {
        messageBox.textContent = message;
        messageBox.className = "message " + type;

        setTimeout(() => {
            messageBox.className = "message";
        }, 4000);
    }

    // API helper
    async function apiRequest(url, options = {}) {
        let response;

        try {
            response = await fetch(url, options);
        } catch (error) {
            throw new Error(
                "Cannot connect to the API. Check that Flask is running and CORS is configured."
            );
        }

        const text = await response.text();
        let data = null;

        if (text) {
            try {
                data = JSON.parse(text);
            } catch {
                data = null;
            }
        }

        if (!response.ok) {
            throw new Error(
                data?.error || `Request failed with status ${response.status}`
            );
        }

        return data;
    }

    // Fetch all courses
    async function loadCourses() {
        courseGrid.innerHTML =
            '<div class="loading">Loading your courses...</div>';

        try {
            courses = await apiRequest(API_URL);
            updateDashboard();
            renderCourses();

        } catch (error) {
            courseGrid.innerHTML = `
                <div class="empty-state">
                    <h3>Unable to load courses</h3>
                    <p>${escapeHTML(error.message)}</p>
                    <br>
                    <button class="primary-btn" onclick="loadCourses()">
                        Try Again
                    </button>
                </div>
            `;

            updateDashboard();
        }
    }

    // Prevent HTML injection when displaying API data
    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[char]);
    }

    // Update dashboard statistics
    function updateDashboard() {
        document.getElementById("totalCount").textContent =
            courses.length;

        document.getElementById("pendingCount").textContent =
            courses.filter(c => c.status === "Not Started").length;

        document.getElementById("progressCount").textContent =
            courses.filter(c => c.status === "In Progress").length;

        document.getElementById("completedCount").textContent =
            courses.filter(c => c.status === "Completed").length;
    }

    // Render course cards
    function renderCourses() {
        const searchValue =
            document.getElementById("searchInput").value.toLowerCase();

        const selectedStatus =
            document.getElementById("statusFilter").value;

        const filteredCourses = courses.filter(course => {
            const matchesSearch =
                course.course_name.toLowerCase().includes(searchValue);

            const matchesStatus =
                selectedStatus === "All" ||
                course.status === selectedStatus;

            return matchesSearch && matchesStatus;
        });

        if (filteredCourses.length === 0) {
            courseGrid.innerHTML = `
                <div class="empty-state">
                    <h3>No courses found</h3>
                    <p>Add a course or change your search filters.</p>
                </div>
            `;
            return;
        }

        courseGrid.innerHTML = filteredCourses.map(course => {
            const statusClass = {
                "Not Started": "not-started",
                "In Progress": "in-progress",
                "Completed": "completed"
            }[course.status] || "not-started";

            return `
                <article class="course-card">
                    <h3>${escapeHTML(course.course_name)}</h3>

                    <p class="description">
                        ${escapeHTML(course.description)}
                    </p>

                    <span class="status ${statusClass}">
                        ${escapeHTML(course.status)}
                    </span>

                    <div class="course-info">
                        <div>
                            Target:
                            ${escapeHTML(course.target_completion_date)}
                        </div>

                        <div>
                            Created:
                            ${escapeHTML(course.created_at || "N/A")}
                        </div>

                        <div>
                            Course ID: ${escapeHTML(course.id)}
                        </div>
                    </div>

                    <div class="card-actions">
                        <button
                            class="edit-btn"
                            onclick="editCourse(${Number(course.id)})"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteCourse(${Number(course.id)})"
                        >
                            Delete
                        </button>
                    </div>
                </article>
            `;
        }).join("");
    }

    // Open modal
    function openModal() {
        courseModal.classList.add("active");
    }

    // Close modal
    function closeModal() {
        courseModal.classList.remove("active");
        courseForm.reset();
        editingCourseId = null;

        document.getElementById("modalTitle").textContent =
            "Add New Course";

        document.getElementById("saveBtn").textContent =
            "Save Course";
    }

    // Open Add Course form
    document.getElementById("addCourseBtn").addEventListener(
        "click", () => {
            closeModal();
            openModal();
        }
    );

    document.getElementById("closeModalBtn").addEventListener(
        "click", closeModal
    );

    document.getElementById("cancelBtn").addEventListener(
        "click", closeModal
    );

    // Create or update course
    courseForm.addEventListener("submit", async event => {
        event.preventDefault();

        const courseData = {
            course_name: document.getElementById("courseName").value.trim(),
            description: document.getElementById("description").value.trim(),
            target_completion_date:
                document.getElementById("targetDate").value,
            status: document.getElementById("courseStatus").value
        };

        const saveButton = document.getElementById("saveBtn");

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {
            if (editingCourseId !== null) {
                await apiRequest(`${API_URL}/${editingCourseId}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(courseData)
                });

                showMessage("Course updated successfully!", "success");

            } else {
                await apiRequest(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(courseData)
                });

                showMessage("Course created successfully!", "success");
            }

            closeModal();
            await loadCourses();

        } catch (error) {
            showMessage(error.message, "error");

        } finally {
            saveButton.disabled = false;
            saveButton.textContent =
                editingCourseId !== null ? "Update Course" : "Save Course";
        }
    });

    // Edit course
    function editCourse(courseId) {
        const course = courses.find(c => c.id === courseId);

        if (!course) return;

        editingCourseId = courseId;

        document.getElementById("courseName").value =
            course.course_name;

        document.getElementById("description").value =
            course.description;

        document.getElementById("targetDate").value =
            course.target_completion_date;

        document.getElementById("courseStatus").value =
            course.status;

        document.getElementById("modalTitle").textContent =
            "Edit Course";

        document.getElementById("saveBtn").textContent =
            "Update Course";

        openModal();
    }

    // Delete course
    async function deleteCourse(courseId) {
        const confirmed = confirm(
            "Are you sure you want to delete this course?"
        );

        if (!confirmed) return;

        try {
            await apiRequest(`${API_URL}/${courseId}`, {
                method: "DELETE"
            });

            showMessage("Course deleted successfully!", "success");

            await loadCourses();

        } catch (error) {
            showMessage(error.message, "error");
        }
    }

    // Search and filter
    document.getElementById("searchInput").addEventListener(
        "input", renderCourses
    );

    document.getElementById("statusFilter").addEventListener(
        "change", renderCourses
    );

    // Initial application load
    loadCourses();
</script>

</body>
</html>
